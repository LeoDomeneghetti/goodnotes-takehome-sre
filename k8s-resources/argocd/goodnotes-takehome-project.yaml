apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: goodnotes-takehome
  namespace: argocd
  # Finalizer that ensures that project is not deleted until it is not referenced by any application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: K8s basics testing project
  # Allow manifests to deploy from any Git repos
  sourceRepos:
  - 'git@github.com:LeoDomeneghetti/goodnotes-takehome-sre.git'
  # Only permit applications to deploy to the goodnotes-takehome namespace in the same cluster
  destinations:
  - namespace: goodnotes-takehome
    server: https://kubernetes.default.svc
