kind: Service
metadata:
  name: foo-app-service
  labels:
    namespace: goodnotes-takehome
spec:
  type: NodePort
  ports:
  - name: foo-port
    port: 8082
    targetPort: 5000
    nodePort: 30009
    protocol: TCP
  selector:
    app: foo-app
    namespace: goodnotes-takehome
    tier: backend