apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foo-app-ingress
  labels:
    namespace: goodnotes-takehome
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /foo
        backend:
          service:
            name: foo-app-service
            port:
              number: 8082